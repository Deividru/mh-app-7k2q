<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mis Horas Ingenix</title>
<style>body{margin:0}
:root{--navy:#14284a;--navy2:#1b3a63;--blue:#2d6cb3;--sky:#5aa0e6;--pale:#e8f1fb;--bg:#eef2f7;--card:#fff;--ink:#14233a;--muted:#5d6f88;--line:#dbe3ee;--ok:#1f8a5b;--okbg:#e4f5ec;--bad:#c0392b;--badbg:#fdecea;--warn:#b7791f;--warnbg:#fff6e0;--shadow:0 2px 10px rgba(20,40,74,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1626;--card:#152238;--ink:#e6edf7;--muted:#9fb0c8;--line:#26364f;--pale:#1c3050;--okbg:#14382a;--badbg:#3c1d1a;--warnbg:#3a2e12;--shadow:0 2px 10px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0d1626;--card:#152238;--ink:#e6edf7;--muted:#9fb0c8;--line:#26364f;--pale:#1c3050;--okbg:#14382a;--badbg:#3c1d1a;--warnbg:#3a2e12;--shadow:0 2px 10px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}html,body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:10px 16px 12px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:560px;margin:0 auto}
header img{height:30px}
.htit{font-weight:700;font-size:17px}.hsub{font-size:12.5px;color:#b9cbe6}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(28px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--blue);font-weight:650}
nav svg{width:24px;height:24px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:650}
.daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.daynav b{font-size:20px}.daynav small{display:block;color:var(--muted);font-size:13px}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;display:grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font:inherit;font-size:14.5px;min-height:40px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px;font-weight:600}
select,input[type=text],input[type=number],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
textarea{min-height:70px;resize:vertical}
.tr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}.tr .sep{padding-bottom:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;font:inherit;font-weight:650;font-size:16px;min-height:50px;padding:12px 16px}
.btn.sec{background:var(--pale);color:var(--blue)}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.btn.small{min-height:40px;font-size:14px;padding:8px 12px;width:auto}
.btn.mini{min-height:34px;font-size:13px;padding:6px 10px;width:auto;border-radius:10px}
.row{display:flex;gap:10px;align-items:center}.row.wrap{flex-wrap:wrap}.sp{justify-content:space-between}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.calc div{background:var(--pale);border-radius:12px;padding:10px 4px}.calc span{display:block;font-size:11.5px;color:var(--muted)}.calc b{font-size:19px}
.pos{color:var(--ok)}.neg{color:var(--bad)}.muted{color:var(--muted)}.small{font-size:13px}
.warn{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.okm{background:var(--okbg);color:var(--ok);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:6px 0}
.sw{width:52px;height:32px;border-radius:999px;background:var(--line);position:relative;border:0;flex:none}.sw i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}.sw.on{background:var(--blue)}.sw.on i{left:23px}
.days{display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}html,body{overflow-x:hidden}
.dcard{min-width:0;overflow:hidden;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;width:100%;font:inherit;color:var(--ink);text-align:left}
.dcard .dd{width:46px;text-align:center;flex:none}.dcard .dd b{display:block;font-size:20px;line-height:1}.dcard .dd span{font-size:12px;color:var(--muted);text-transform:uppercase}
.dcard .mid{flex:1;min-width:0}.dcard .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dcard .h{font-weight:700;font-size:17px;text-align:right}
.dcard.today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}.dcard.we{background:var(--bg)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;background:var(--pale);color:var(--blue);font-weight:600;margin-right:4px}
.tag.f{background:var(--okbg);color:var(--ok)}.tag.c{background:var(--warnbg);color:var(--warn)}.tag.v{background:var(--pale);color:var(--blue)}
.wsum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.wsum div{background:var(--pale);border-radius:12px;padding:10px 12px}.wsum span{display:block;font-size:12px;color:var(--muted)}.wsum b{font-size:20px}
.path{font-family:ui-monospace,Menlo,monospace;font-size:13.5px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;word-break:break-all}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);font-weight:600}td.r,th.r{text-align:right}
.toast{pointer-events:none;position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:12px;padding:10px 16px;font-size:14px;z-index:50;box-shadow:var(--shadow);max-width:90vw}
.hide{display:none}
.saved{font-size:12px;color:#b9cbe6}
.hback{border:1px solid rgba(255,255,255,.35);background:none;color:#fff;font:inherit;font-weight:600;font-size:15px;border-radius:10px;padding:8px 12px;min-height:40px}
.perfil{display:flex;gap:14px;align-items:center}.av{width:56px;height:56px;border-radius:16px;background:var(--navy2);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none}
.perfil b{font-size:18px;display:block}.perfil small{color:var(--muted);display:block;line-height:1.35}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}.kpis div{background:var(--pale);border-radius:12px;padding:9px 10px}.kpis span{display:block;font-size:11.5px;color:var(--muted)}.kpis b{font-size:17px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;min-height:118px;font:inherit;color:var(--ink);box-shadow:var(--shadow)}
.tile .ti{width:38px;height:38px;border-radius:11px;background:var(--pale);color:var(--blue);display:grid;place-items:center}.tile .ti svg{width:21px;height:21px}
.tile b{font-size:15.5px}.tile small{color:var(--muted);font-size:12.5px;line-height:1.35}.tile.alert .ti{background:var(--badbg);color:var(--bad)}.tile.lock{opacity:.8}
.seg2{display:flex;background:var(--pale);border-radius:12px;padding:4px;gap:4px;margin-bottom:14px}.seg2 button{flex:1;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);border-radius:9px;padding:9px 0}.seg2 button.on{background:var(--card);color:var(--blue);box-shadow:var(--shadow)}
.steps2{display:grid;gap:12px}.st2{display:flex;gap:12px}.st2>span{flex:none;width:30px;height:30px;border-radius:9px;background:var(--pale);color:var(--blue);display:grid;place-items:center;font-weight:700}.st2.done>span{background:var(--okbg);color:var(--ok)}
nav button{min-width:0;font-size:11px}
#cotOv{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#cotOv .cotbar{display:flex;align-items:center;gap:10px;padding:8px max(12px,env(safe-area-inset-left,0px));background:var(--navy);color:#fff;font-size:13px}
#cotOv .cotbar .btn{color:#fff;border-color:rgba(255,255,255,.35)}
#cotOv iframe{flex:1;width:100%;border:0;background:#fff}
</style></head><body>
